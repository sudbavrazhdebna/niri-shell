[package]
name = "nshell"
version = "0.1.0"
edition = "2024"
description = "A small desktop shell for niri: bar, menus, OSD, notifications, idle, dock"
license = "MIT"
publish = false

[dependencies]
gdk4-wayland = { version = "0.11", features = ["wayland_crate"] }
gio = "0.22"
glib = "0.22"
gio-unix = { version = "0.22", features = ["v2_58"] }
glib-unix = "0.22"
gtk4 = { version = "0.11", package = "gtk4", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
kdl = { version = "6", default-features = false, features = ["span", "v1-fallback"] }
libc = "0.2"
libpulse-binding = "2.29"
libpulse-glib-binding = "2.29"
niri-ipc = "26.4"
regex = "1"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[build-dependencies]
glib-build-tools = "0.22"
